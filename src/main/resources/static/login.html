<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Seminovos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">

            <h1>Seminovos</h1>
            <p>Sistema de Gestão Operacional</p>

            <div id="mensagem-erro" class="mensagem-erro"></div>

            <form id="form-login">

                <div class="form-group">
                    <label for="login">Login</label> 
                    <input type="text" id="login" placeholder="Digite seu login" required>   
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label> 
                    <input type="password" id="senha" placeholder="Digite sua senha" required>   
                </div>

                <div id="loading" class="loading">Entrando...</div>

                <button type="submit" id="btn-entrar" class="btn-primario">Entrar</button>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/permissions.js"></script>
    <script src="js/pages/login.js"></script>

</body>
</html>
